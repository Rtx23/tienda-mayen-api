spring.application.name=gestion
spring.profiles.default=demo
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/tienda-mayen;WRITE_DELAY=0}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
server.error.include-message=never
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=tienda-mayen
app.jwt.ttl-seconds=3600
app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
app.bootstrap.enabled=${BOOTSTRAP_USERS:false}